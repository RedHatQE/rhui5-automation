---
# file: roles/k8s/tasks/main.yml
# generate and copy the k8s configuration YAML file

- name: set a non-default K8s image name
  lineinfile:
    path: /var/lib/rhui/config/rhua/rhui-tools.conf
    insertafter: "^\\[rhui\\]"
    line: "default_container_cds_k8s_image: {{ cds_k8s_image }}"
  when: cds_k8s_image is defined and inventory_hostname in groups['RHUA']
  tags: kube

- name: generate the default k8s configuration file
  shell: "{{ rhui_manager_notty }} cds k8s --inject /etc/hosts:/etc/hosts > /tmp/test.yaml"
  become_user: rhui
  when: inventory_hostname in groups['RHUA']
  tags: kube

- name: generate the k8s configuration file with a TLS secret
  shell: "{{ rhui_manager_notty }} cds k8s --ssl_cert_secret_name test --inject /etc/hosts:/etc/hosts > /tmp/test2.yaml"
  become_user: rhui
  when: inventory_hostname in groups['RHUA']
  tags: kube

- name: fetch the k8s configuration files and TLS files
  fetch:
    src: "{{ item }}"
    dest: /tmp/
    flat: True
  loop:
    - /tmp/test.yaml
    - /tmp/test2.yaml
    - /export/cds-config/ssl/lb.example.com.crt
    - /export/cds-config/ssl/lb.example.com.key
  when: inventory_hostname in groups['RHUA']
  tags: kube

- name: upload the k8s configuration files and TLS files
  copy:
    src: "/tmp/{{ item }}"
    dest: /tmp/
  loop:
    - test.yaml
    - test2.yaml
    - lb.example.com.crt
    - lb.example.com.key
  when: inventory_hostname in groups['HAPROXY']
  tags: kube

- name: apply the k8s configuration file
  command: minikube kubectl -- apply -f /tmp/test.yaml
  become: False
  when: inventory_hostname in groups['HAPROXY']
  tags: kube

- name: create the TLS secret in Minikube
  command: minikube kubectl -- create secret tls test --cert=/tmp/lb.example.com.crt --key=/tmp/lb.example.com.key
  become: False
  when: inventory_hostname in groups['HAPROXY']
  tags: kube

- name: upload the list of additional manual commands
  template:
    src: k8s_commands.j2
    dest: /home/{{ ansible_env.SUDO_USER }}/bin/k8s_commands.sh
    mode: "755"
  become: False
  when: inventory_hostname in groups['HAPROXY']
  tags: kube

- name: describe the steps to complete the minikube setup
  debug:
    msg:
      - You can now log in using ssh -L 45555:localhost:45555 {{ inventory_hostname }}
      - Then run k8s_commands.sh
      - And open http://127.0.0.1:45555/api/v1/namespaces/kubernetes-dashboard/services/http:kubernetes-dashboard:/proxy/
      - To switch from the default configuration to the one using a TLS secret, run
      - minikube kubectl -- delete -f /tmp/test.yaml
      - minikube kubectl -- apply -f /tmp/test2.yaml
  when: inventory_hostname in groups['HAPROXY']
  tags: kube

- name: describe the steps to test the minikube setup
  debug:
    msg:
      - To run tests, first run the following commands on the test machine, ie. --
      - ssh {{ groups['TEST'][0] }}
      - sudo su -
      - rhuitestsetup --cert-only
      - export RHUISKIPSETUP=1
      - export RHUIPREP=1
      - rhuitests client_management
      - ... and continue on the client machine, ie. --
      - ssh {{ groups['CLI'][0] }}
      - sudo yum list available
  run_once: True
  when: "'TEST' in groups and 'CLI' in groups"
  tags: kube
